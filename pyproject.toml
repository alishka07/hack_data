[project]
name = "forte-local-review"
version = "0.1.0"
description = "Local, evidence-backed cash-procedure video review prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "pydantic==2.12.5",
  "pydantic-core==2.41.5",
  "python-multipart==0.0.32",
  "opencv-python-headless==5.0.0.93",
  "numpy==2.5.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "openpyxl==3.1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
